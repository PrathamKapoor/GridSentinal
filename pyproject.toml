[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "energy-intelligence"
version = "0.1.0"
description = "Adaptive, self-verifying energy intelligence system (Yuva Yodha Energy Tech Hackathon 2026, Schneider Electric)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "PrathamKapoor", email = "prathamkapoor027@gmail.com" }]

# Phases 1-3 shipped with NO runtime dependencies: configuration, logging,
# testing, the health check and the whole Phase 3 SMART-DS ingestion pipeline
# run on the standard library alone (D-004, D-005).
#
# Phase 4 is the first phase that genuinely needs a numerical stack, so exactly
# three are added and no more (D-055, D-056):
#   numpy        - array storage and the dataset representation
#   scikit-learn - classical baselines (Ridge, HistGradientBoosting)
#   torch (CPU)  - the one conventional neural baseline
# pandas was deliberately NOT added: every dataset here is a numeric matrix, and
# an unused dependency is a maintenance liability.
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "torch>=2.5",
]

[[tool.uv.index]]
# CPU-only PyTorch wheels. The default PyPI torch wheel for Windows bundles
# CUDA and is several hundred megabytes; a hackathon prototype on CPU does
# not need it. The index is explicit, so it is only consulted for packages
# that opt in with --index (see decisions.md D-056).
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[project.scripts]
energy-intel = "energy_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_intelligence"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["energy_intelligence"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
