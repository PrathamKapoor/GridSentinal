# Phase 4 experiment: PV generation at 1, 2, 4 and 96 steps, WITHOUT weather.
#
# The companion to configs/ml_pv_nowcast.toml. Two horizons are consecutive (1 and
# 2), which is what makes the ramp metric computable: a ramp is a change between
# consecutive steps, so it is reported as n/a whenever the declared horizons are not
# adjacent.
#
# Weather features are switched OFF here, and the dataset builder records why. With
# actual observations only, anything beyond 15 minutes would be leakage, because no
# weather forecast exists in SMART-DS. That makes this run the honest measurement of
# how far pure extrapolation of PV output can go - which is the number a day-ahead
# PV forecaster has to beat once a weather forecast is obtained.
#
# Unknown keys are REJECTED (D-007).

target = "pv_generation"
label = "pv-no-weather"

lookback_steps = 672
horizons = [1, 2, 4, 96]

train_fraction = 0.70
validation_fraction = 0.15
origin_stride = 1

customer_count = 40
commercial_fraction = 0.25

include_weather = false

seed = 20260101
torch_threads = 4
models = [
    "naive_last_value",
    "naive_seasonal_day",
    "naive_seasonal_week",
    "classical_ridge",
    "classical_hist_gbm",
]
